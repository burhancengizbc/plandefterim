<!DOCTYPE html>
<html>
<head>
  <base href="/plandefterim/"> <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plan Defterim - Kişisel Planlama ve Takip Uygulaması">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Plan Defterim">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Plan Defterim</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #f3f4f6;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loading-container {
      text-align: center;
    }
    .loader {
      border: 6px solid #e5e7eb;
      border-top: 6px solid #3b82f6; /* Modern Mavi */
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      color: #374151;
      font-size: 18px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="loader"></div>
    <div class="loading-text">Plan Defterim Yükleniyor...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
