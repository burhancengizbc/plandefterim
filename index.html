<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Defterim | Zamanın Ötesinde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&family=Dancing+Script:wght@700&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --paper: #fdfbf7;
        }

        body {
            background: #05070a;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Fütüristik Arka Plan */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #05070a 100%);
        }

        .floating-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            filter: blur(100px);
            opacity: 0.3;
            border-radius: 50%;
            animation: float 15s infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 100px) scale(1.2); }
        }

        /* İnteraktif Defter Mekaniği */
        .book-container {
            perspective: 2000px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .book {
            width: 100%;
            max-width: 1000px;
            height: 700px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        .page {
            width: 50%;
            height: 100%;
            position: absolute;
            top: 0;
            right: 0;
            transform-origin: left;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            background: var(--paper);
            box-shadow: inset 3px 0 10px rgba(0,0,0,0.1);
            color: #333;
            padding: 40px;
            backface-visibility: hidden;
            border-radius: 0 15px 15px 0;
        }

        /* Klasik Defter Çizgileri */
        .classic-lines {
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 28px;
            line-height: 28px;
        }

        .page.front {
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Spiral Yapısı */
        .spirals {
            position: absolute;
            left: -15px;
            top: 20px;
            bottom: 20px;
            width: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .ring {
            width: 40px;
            height: 12px;
            background: linear-gradient(to right, #222, #555, #222);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .handwriting {
            font-family: 'Dancing Script', cursive;
            color: #2563eb;
            font-size: 1.8rem;
        }

        .futuristic-btn {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 12px 30px;
            border-radius: 5px;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
        }

        .futuristic-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Mouse Takip Efekti */
        #glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0,210,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="glow"></div>
    <div class="cyber-bg"></div>
    <div class="floating-orb" style="top: 10%; left: 10%;"></div>
    <div class="floating-orb" style="bottom: 10%; right: 10%; animation-delay: -5s;"></div>

    <div class="book-container">
        <div class="book" id="myBook">
            
            <div class="page front" id="cover">
                <div class="spirals">
                    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                </div>
                <h1 class="text-6xl font-extrabold mb-4 tracking-tighter" data-aos="fade-up">PLAN<br>DEFTERİM</h1>
                <p class="text-indigo-400 font-mono tracking-widest mb-8">VERSION 2026.PRO</p>
                <button onclick="flipBook()" class="futuristic-btn">Defteri Aç</button>
            </div>

            <div class="page" id="insidePage" style="left: 0; transform-origin: right; border-radius: 15px 0 0 15px; background: #fff;">
                <div class="classic-lines h-full">
                    <h2 class="text-2xl font-bold mb-4 text-gray-800">Bugünün Notları_</h2>
                    <ul class="handwriting space-y-4">
                        <li data-aos="fade-right">1. Geleceği planla...</li>
                        <li data-aos="fade-right" data-aos-delay="100">2. Kaosu düzene sok.</li>
                        <li data-aos="fade-right" data-aos-delay="200">3. Hedeflerine odaklan.</li>
                        <li data-aos="fade-right" data-aos-delay="300">4. Plan Defterim'i kullan.</li>
                    </ul>
                    
                    <div class="mt-20 p-6 border-2 border-dashed border-blue-200 rounded-lg">
                        <p class="text-sm text-gray-500 font-mono uppercase">Sistem Durumu:</p>
                        <p class="text-green-600 font-bold tracking-tighter">YARATICILIK AKTİF %100</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="fixed bottom-10 left-0 w-full text-center text-xs tracking-widest text-gray-600 uppercase">
        Kaydır veya tıkla • Plan Defterim Digital Experience
    </div>

    <script>
        AOS.init();

        // Mouse Takip Efekti
        const glow = document.getElementById('glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // Sayfa Çevirme Fonksiyonu
        function flipBook() {
            const cover = document.getElementById('cover');
            cover.classList.toggle('flipped');
        }

        // Mouse Wheel ile Sayfa Çevirme
        window.addEventListener('wheel', (e) => {
            const cover = document.getElementById('cover');
            if (e.deltaY > 0) {
                cover.classList.add('flipped');
            } else {
                cover.classList.remove('flipped');
            }
        });
    </script>
</body>
</html>
